<!-- partials/chart-panel.html — B-Step 1: extracted verbatim block from graphify.html.
     Shell keeps <div id="chart"><canvas id="myChart"></canvas></div> + dataset switcher target. -->
<div id="chart"><canvas id="myChart"></canvas></div>
<div class="gs-chartbar">
  <label for="gs-dataset">Dataset</label>
  <select id="gs-dataset">
    <option value="sample">Sample (10 pts)</option>
    <option value="glshape">GL 46x12 shape demo (552 pts)</option>
  </select>
  <span id="gs-source" class="gs-source" aria-live="polite"></span>
</div>
<div id="gs-empty" class="gs-empty" hidden></div>
